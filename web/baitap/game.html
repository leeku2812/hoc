<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trò chơi Nhảy lên</title>
    <style>
        body {
            margin: 0;
            overflow: hidden;
            background-color: #87CEEB;
            font-family: Arial, sans-serif;
        }
        .game-container {
            position: relative;
            width: 100%;
            height: 100vh;
            background-color: #87CEEB;
            overflow: hidden;
        }
        .player {
            position: absolute;
            bottom: 50px;
            left: 50px;
            width: 50px;
            height: 50px;
            background-color: #FF4500;
        }
        .obstacle {
            position: absolute;
            bottom: 50px;
            width: 30px;
            height: 50px;
            background-color: #228B22;
            animation: moveObstacle 2s linear infinite;
        }
        @keyframes moveObstacle {
            0% {
                right: -30px;
            }
            100% {
                right: 100%;
            }
        }
        .message {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 30px;
            color: white;
            display: none;
        }
    </style>
</head>
<body>

    <div class="game-container">
        <div class="player"></div>
        <div class="message" id="message">Game Over!</div>
    </div>

    <script>
        let player = document.querySelector('.player');
        let gameContainer = document.querySelector('.game-container');
        let message = document.getElementById('message');

        let playerPositionY = 50; // Vị trí Y ban đầu của người chơi
        let isJumping = false;
        let gameInterval;
        let obstacleInterval;

        // Xử lý sự kiện nhảy
        document.addEventListener('keydown', function(event) {
            if (event.key === ' ' && !isJumping) {
                jump();
            }
        });

        // Hàm nhảy
        function jump() {
            isJumping = true;
            let jumpHeight = 0;

            let jumpUp = setInterval(function() {
                if (jumpHeight >= 150) {
                    clearInterval(jumpUp);
                    let fallDown = setInterval(function() {
                        if (jumpHeight <= 50) {
                            clearInterval(fallDown);
                            isJumping = false;
                        } else {
                            jumpHeight -= 10;
                            player.style.bottom = jumpHeight + 'px';
                        }
                    }, 20);
                } else {
                    jumpHeight += 10;
                    player.style.bottom = jumpHeight + 'px';
                }
            }, 20);
        }

        // Hàm tạo chướng ngại vật
        function createObstacle() {
            let obstacle = document.createElement('div');
            obstacle.classList.add('obstacle');
            obstacle.style.left = '100%';
            gameContainer.appendChild(obstacle);

            let obstaclePositionX = gameContainer.offsetWidth;

            let obstacleMove = setInterval(function() {
                if (obstaclePositionX < -30) {
                    clearInterval(obstacleMove);
                    gameContainer.removeChild(obstacle);
                } else {
                    obstaclePositionX -= 5;
                    obstacle.style.left = obstaclePositionX + 'px';

                    // Kiểm tra va chạm
                    if (obstaclePositionX < 100 && obstaclePositionX > 50 && playerPositionY <= 100) {
                        gameOver();
                    }
                }
            }, 20);
        }

        // Hàm kết thúc game
        function gameOver() {
            clearInterval(gameInterval);
            clearInterval(obstacleInterval);
            message.style.display = 'block';
        }

        // Hàm bắt đầu game
        function startGame() {
            gameInterval = setInterval(function() {
                playerPositionY = parseInt(player.style.bottom || 50);
            }, 20);

            obstacleInterval = setInterval(createObstacle, 2000); // Mỗi 2 giây tạo một chướng ngại vật
        }

        startGame();
    </script>

</body>
</html>
